<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация - "Базилико"</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">
      <img src="img/logo.jpg" alt="Логотип Базилико">
      <span>Базилико</span>
    </a>
    <button class="burger" id="burger">☰</button>
    <nav class="menu" id="menu">
      <a href="index.html">Главная</a>
      <a href="menu.html">Меню</a>
      <a href="about.html">О пиццерии</a>
      <a href="contacts.html">Контакты</a>
      <a href="registration.html" class="active">Регистрация</a>
      <a href="cart.html">Корзина</a>
      <a href="payment.html">Оплата</a>
    </nav>
  </header>
  <section class="block">
    <form id="registrationForm" class="form">
      <label for="login">Логин *</label>
      <input type="text" id="login" placeholder="Введите логин" required>
      <label for="email">Электронная почта *</label>
      <input type="email" id="email" placeholder="example@mail.ru" required>
      <label for="password">Пароль *</label>
      <input type="password" id="password" placeholder="Минимум 6 символов" required>
      <button type="submit" class="btn">Зарегистрироваться</button>
      <p id="registrationResult" class="result"></p>
    </form>
    <p class="note">
      Форма демонстрационная. Данные никуда не отправляются.
    </p>
  </section>
  <footer class="footer">
    <p>© 2026 ООО "Базилико".</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
