<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Оплата - "Базилико"</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">
      <img src="img/logo.jpg" alt="Логотип Базилико">
      <span>Базилико</span>
    </a>
    <button class="burger" id="burger">☰</button>
    <nav class="menu" id="menu">
      <a href="index.html">Главная</a>
      <a href="menu.html">Меню</a>
      <a href="about.html">О пиццерии</a>
      <a href="contacts.html">Контакты</a>
      <a href="registration.html">Регистрация</a>
      <a href="cart.html">Корзина</a>
      <a href="payment.html" class="active">Оплата</a>
    </nav>
  </header>
  <section class="hero small">
    <h1>Оплата</h1>
    <p>Введите данные банковской карты.</p>
  </section>
  <section class="block">
    <form id="paymentForm" class="form">
      <label for="card">Номер карты *</label>
      <input type="text" id="card" placeholder="0000 0000 0000 0000" required>

      <label for="date">Срок действия *</label>
      <input type="text" id="date" placeholder="ММ/ГГ" required>

      <label for="cvv">CVV *</label>
      <input type="text" id="cvv" placeholder="000" required>

      <button type="submit" class="btn">Оплатить</button>

      <p id="paymentResult" class="result"></p>
    </form>

    <p class="note">
      Форма демонстрационная. Реальная оплата не производится.
    </p>
  </section>
  <footer class="footer">
    <p>© 2026 ООО "Базилико"</p>
  </footer>
  <script src="script.js"></script>
</body>
</html>
